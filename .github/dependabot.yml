# Brief §4: "Add Renovate or Dependabot on day one, with `next` and `react-server-dom-*` grouped
# together." This was missed during Foundation and found while reviewing the repo during D-009 --
# it is not in BACKLOG.md, DECISIONS.md or DROPPED.md, so it was an oversight rather than a
# deliberate deferral.
#
# Dependabot rather than Renovate: Renovate is the more configurable of the two, but it needs a
# GitHub App installed on the account, which is the operator's decision and not something this
# repo can provision for itself. Dependabot is native, needs only this file, and the one feature
# the brief actually asks for -- grouping -- it supports.
version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # The brief's own grouping requirement. These ship as a coordinated release and a partial
      # bump is a broken build at best; `react-server-dom-*` are transitive today but named here
      # so they stay grouped if they ever become direct dependencies.
      next:
        patterns:
          - "next"
          - "@next/*"
          - "eslint-config-next"
          - "react-server-dom-*"
      # React and its types move together for the same reason.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # Radix primitives all come from the single `radix-ui` package (DEC-054), but its own
      # sub-packages surface in the lockfile; keep them in one PR rather than a dozen.
      radix:
        patterns:
          - "radix-ui"
          - "@radix-ui/*"
      dev-tooling:
        patterns:
          - "eslint*"
          - "prettier"
          - "typescript"
          - "vitest"
          - "@playwright/*"
          - "@types/node"

  # Keeps the CI workflow's own actions current -- the same supply-chain surface, and free.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
