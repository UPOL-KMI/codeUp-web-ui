name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # v7, not v4: v4 runs on the Node 20 actions runtime, which GitHub is retiring.
      # v5 and up run on node24. Checked against the actions' own `action.yml` rather than
      # assumed -- and v7 rather than v5 for a second reason: setup-node v5 introduced
      # automatic package-manager caching keyed on `package.json#packageManager`, which would
      # have tried to cache pnpm before `corepack enable` below had installed it. v6 limited
      # that automatic caching to npm, so the hazard is gone. This repo declares no
      # `packageManager` field, so it would not have fired either way.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # corepack (not actions/setup-pnpm) to match this repo's Dockerfile exactly --
      # one source of truth for "how do you get pnpm" instead of two.
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm test
